name: Test Suite

# Reusable test suite — the single definition of "is this commit green?".
#
# Called by:
#   - test.yml              → pull requests
#   - deploy-production.yml → gate before the hosting deploy
#   - deploy-backend.yml    → gate before the Firestore rules / Functions deploy
#
# Extracted so the deploy workflows can depend on the suite via `needs:`
# without duplicating it. Previously the deploy workflows triggered on
# `push: main` independently of the test workflow, so both ran in parallel and
# a red suite did not stop a production deploy.
#
# Takes no secrets and requires none: the suite runs entirely against local
# emulators. That is what makes it safe to call from a deploy workflow that
# does hold credentials — the tests never see them.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_CLI_VERSION: '15.15.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci --prefer-offline

      - name: Install functions dependencies
        run: npm ci --prefer-offline --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Install firebase-tools (pinned)
        run: npm install -g firebase-tools@${FIREBASE_CLI_VERSION}

      - name: Run test suite
        run: npm run test

      - name: Upload firestore debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-debug-log
          path: firestore-debug.log
          if-no-files-found: ignore
