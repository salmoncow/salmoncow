name: Test Suite

# Reusable test suite — the single definition of "is this commit green?".
#
# Called by:
#   - test.yml              → pull requests
#   - deploy-production.yml → gate before the hosting deploy
#   - deploy-backend.yml    → gate before the Firestore rules / Functions deploy
#
# Split into two jobs because the two halves need different Node versions:
# root tooling declares engines.node >=24 <25, while Cloud Functions run on
# nodejs22 in production. Running the functions tests on 24 (as this workflow
# originally did) masks exactly the runtime differences DEVELOPMENT.md warns
# about. Separate jobs keep each install and global CLI on the right version;
# switching versions mid-job would relocate the npm global prefix and take
# firebase-tools off PATH.
#
# BOTH jobs are required status checks on main (ruleset 10371166). Renaming a
# job here silently breaks that ruleset — a required check that is never
# reported never goes green, which makes every PR unmergeable. Pair any rename
# with a ruleset update.
#
# Takes no secrets and requires none: the suite runs entirely against local
# emulators. That is what makes it safe to call from deploy workflows that do
# hold credentials — the tests never see them.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_CLI_VERSION: '15.15.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Matches root .nvmrc and package.json engines (>=24 <25).
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci --prefer-offline

      - name: Lint
        # Steps, not separate jobs: each job becomes its own required status
        # check, and adding one without updating the branch ruleset silently
        # stops gating on it.
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        # Verifies the JSDoc across src/ via tsc. Deliberately a step in this
        # job rather than a job of its own: each job becomes its own required
        # status check, and adding one without updating the branch ruleset
        # silently stops gating on it.
        run: npm run typecheck

      - name: Build web app
        # Catches a broken Vite build in CI rather than at deploy time, and
        # produces dist/ so the CSP inline-script hash test actually executes
        # — without it that test skips itself and the guard is vacuous.
        run: npm run build

      - name: Install firebase-tools (pinned)
        run: npm install -g firebase-tools@${FIREBASE_CLI_VERSION}

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Firestore rules tests
        run: npm run test:rules

      - name: Upload firestore debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-debug-log
          path: firestore-debug.log
          if-no-files-found: ignore

  functions:
    name: Run functions tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_CLI_VERSION: '15.15.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Must match functions/.nvmrc, functions/package.json engines, and the
        # deployed runtime (firebase.json → nodejs22).
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        run: npm ci --prefer-offline --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Install firebase-tools (pinned)
        run: npm install -g firebase-tools@${FIREBASE_CLI_VERSION}

      - name: Run functions tests
        run: npm run test:functions

      - name: Upload firestore debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-debug-log-functions
          path: firestore-debug.log
          if-no-files-found: ignore
