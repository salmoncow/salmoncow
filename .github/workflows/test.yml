name: Test

# Pull-request test run. The suite itself lives in test-suite.yml so the
# deploy workflows can gate on the same definition via `needs:`.
#
# No `push: main` trigger: on main the suite runs as the gating job inside
# deploy-production.yml (which fires on every push) and deploy-backend.yml.
# Adding it here too would run the same suite a third time per push without
# blocking anything.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test-suite.yml
