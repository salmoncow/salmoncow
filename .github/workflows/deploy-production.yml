name: Deploy to Production

# SECURITY: This workflow uses FIREBASE_SERVICE_ACCOUNT for deployment
# - Service account has custom IAM permissions for Firebase Hosting and Auth domain management
# - Changes to this file require review from CODEOWNERS
# - Service account follows least privilege principle (limited to necessary permissions only)

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

# Two pushes landing close together would otherwise race to publish to the
# live channel, and the later-finishing build wins regardless of commit order.
# Queue instead of cancelling: a superseded deploy is still a deploy someone
# may be watching, and hosting releases are cheap.
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate. The deploy job below will not start unless this succeeds, so a red
  # suite blocks the release instead of racing alongside it.
  test:
    name: Test
    uses: ./.github/workflows/test-suite.yml

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Create environment file
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY=${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NODE_ENV=production
          EOF

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}

      - name: Deployment summary
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Live URL: https://${{ vars.VITE_FIREBASE_PROJECT_ID }}.web.app"
          echo "📊 View deployment: https://console.firebase.google.com/project/${{ vars.VITE_FIREBASE_PROJECT_ID }}/hosting"
